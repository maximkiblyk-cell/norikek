# Local integration environment only; review security, TLS, secrets and backups before deployment.
services:
  postgres:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Set in .env.docker}
      POSTGRES_USER: ${POSTGRES_USER:?Set in .env.docker}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set in .env.docker}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 5s
      retries: 20
  migrate:
    build: .
    env_file: .env.docker
    environment:
      AUTO_CREATE_SCHEMA: "false"
    command: ["alembic", "upgrade", "head"]
    depends_on:
      postgres: {condition: service_healthy}
    restart: "no"
  api:
    build: .
    env_file: .env.docker
    environment:
      AUTO_CREATE_SCHEMA: "false"
      DEVICE_PAIRING_ENABLED: "false"
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      migrate: {condition: service_completed_successfully}
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6
  bot:
    build: .
    env_file: .env.docker
    environment:
      AUTO_CREATE_SCHEMA: "false"
      DEVICE_PAIRING_ENABLED: "false"
      API_BASE_URL: http://127.0.0.1:8000
    network_mode: "service:api"
    command: ["python", "-m", "app.bot.main"]
    depends_on:
      api: {condition: service_healthy}
  worker:
    build: .
    env_file: .env.docker
    environment:
      AUTO_CREATE_SCHEMA: "false"
    command: ["python", "-m", "app.worker"]
    depends_on:
      api: {condition: service_healthy}
volumes:
  postgres_data:
